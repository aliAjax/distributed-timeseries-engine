apiVersion: apps/v1
kind: Deployment
metadata: {name: timeseriesd}
spec:
  replicas: 1
  selector: {matchLabels: {app: timeseriesd}}
  template:
    metadata: {labels: {app: timeseriesd}}
    spec:
      containers:
      - name: timeseriesd
        image: timeseriesd:local
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /readyz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: timeseriesd}
spec: {selector: {app: timeseriesd}, ports: [{port: 8080, targetPort: 8080}]}
